name: bitchord_unified
description: BitChord Unified Cross-Platform Client (Windows Desktop & Android APK) with shared sync engine.
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.5
  just_audio: ^0.9.40
  just_audio_windows: ^0.2.2
  window_manager: ^0.4.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
